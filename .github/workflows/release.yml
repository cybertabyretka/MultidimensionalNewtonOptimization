name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            output: mdo-windows.exe
            artifact_name: mdo-windows
          - os: ubuntu-latest
            output: mdo-linux
            artifact_name: mdo-linux
          - os: macos-latest
            output: mdo-darwin
            artifact_name: mdo-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Build
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            g++ -std=c++20 -I . -Wall -Wextra -O2 -static app/main.cpp utils/grid_generator.cpp newton_optimizer.cpp -o mdo-windows.exe
          elif [ "${{ runner.os }}" = "Linux" ]; then
            g++ -std=c++20 -I . -Wall -Wextra -O2 -static app/main.cpp utils/grid_generator.cpp newton_optimizer.cpp -o mdo-linux
          else
            g++ -std=c++20 -I . -Wall -Wextra -O2 -static-libstdc++ app/main.cpp utils/grid_generator.cpp newton_optimizer.cpp -o mdo-darwin
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mdo-*
          path: ./binaries
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: true
          files: |
            binaries/mdo-windows.exe
            binaries/mdo-linux
            binaries/mdo-darwin